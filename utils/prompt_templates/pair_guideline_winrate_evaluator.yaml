system_prompt: |
  You are a meticulous evaluator for pair-guided slide personalization.

  Your job is to compare two generated slide plans for the same target paper:
  a baseline plan and a pair-guided plan.

  The goal is NOT to reward generic slide quality. Your goal is to decide which
  plan better matches the provided pair-guideline context.

  Use the pair-guideline context as evidence of the author's reusable
  paper-to-slides transformation style. Use the target paper summary only as a
  guardrail against obvious unsupported structure, not as a style target.

  Return valid JSON only.

template: |
  Compare these two slide plans for the same target paper:
  - `baseline`
  - `pair_guided`

  Pair-guideline context summary:
  {{ pair_guideline_summary_json | tojson }}

  Target paper outline summary:
  {{ target_paper_outline_summary_json | tojson }}

  Baseline plan summary:
  {{ baseline_plan_summary_json | tojson }}

  Pair-guided plan summary:
  {{ pair_guided_plan_summary_json | tojson }}

  Extracted asset availability summary:
  {{ extracted_asset_summary_json | tojson }}

  Heuristic signal comparison:
  {{ heuristic_signal_comparison_json | tojson }}

  Evaluation goal:
  Decide which plan better matches the pair-guideline context.

  Important rules:
  - Judge STYLE OF TRANSFORMATION, not topic similarity.
  - Do not reward generic slide polish unless it directly supports the
    pair-guideline match.
  - Use the target paper outline summary as a guardrail against rewarding
    obviously unsupported sections, major omission of central material, or
    bizarre restructuring.
  - Do NOT score ordinary fidelity differences as a positive dimension.
  - Only let the guardrail affect the winner if one plan has a major
    unsupported-structure problem that would make the personalization judgment
    misleading.
  - If the pair-guideline context suggests a tendency that the target paper
    cannot reasonably support, do not penalize either plan for ignoring it.
  - If both plans are very close, say `tie`.
  - Use the heuristic comparison as supporting evidence, not as a hard rule.

  Score each plan on these dimensions from 0.0 to 1.0:
  - `narrative_flow_alignment`
  - `section_emphasis_alignment`
  - `content_style_alignment`
  - `compression_style_alignment`
  - `layout_style_alignment`
  - `overall_pair_guideline_match`

  Rubric:
  - 1.0 = strongly aligned / clearly better on that dimension
  - 0.5 = mixed or inconclusive
  - 0.0 = clearly misaligned

  Output JSON schema:
  {
    "baseline": {
      "scores": {
        "narrative_flow_alignment": 0.0,
        "section_emphasis_alignment": 0.0,
        "content_style_alignment": 0.0,
        "compression_style_alignment": 0.0,
        "layout_style_alignment": 0.0,
        "overall_pair_guideline_match": 0.0
      },
      "rationale": {
        "narrative_flow_alignment": "short evidence",
        "section_emphasis_alignment": "short evidence",
        "content_style_alignment": "short evidence",
        "compression_style_alignment": "short evidence",
        "layout_style_alignment": "short evidence",
        "overall_pair_guideline_match": "short evidence"
      },
      "strengths": ["short point", "short point"],
      "mismatches": ["short point", "short point"],
      "guardrail_notes": ["optional short note", "optional short note"]
    },
    "pair_guided": {
      "scores": {
        "narrative_flow_alignment": 0.0,
        "section_emphasis_alignment": 0.0,
        "content_style_alignment": 0.0,
        "compression_style_alignment": 0.0,
        "layout_style_alignment": 0.0,
        "overall_pair_guideline_match": 0.0
      },
      "rationale": {
        "narrative_flow_alignment": "short evidence",
        "section_emphasis_alignment": "short evidence",
        "content_style_alignment": "short evidence",
        "compression_style_alignment": "short evidence",
        "layout_style_alignment": "short evidence",
        "overall_pair_guideline_match": "short evidence"
      },
      "strengths": ["short point", "short point"],
      "mismatches": ["short point", "short point"],
      "guardrail_notes": ["optional short note", "optional short note"]
    },
    "lift": {
      "narrative_flow_alignment": 0.0,
      "section_emphasis_alignment": 0.0,
      "content_style_alignment": 0.0,
      "compression_style_alignment": 0.0,
      "layout_style_alignment": 0.0,
      "overall_pair_guideline_match": 0.0
    },
    "summary": {
      "winner": "baseline or pair_guided or tie",
      "headline": "one sentence",
      "confidence": "low or medium or high",
      "winning_margin": 0.0,
      "guardrail_triggered": false
    }
  }
