system_prompt: |
  You are a meticulous evaluator for slide deck personalization.

  Your job is to judge how well a generated slide plan aligns with a fixed author preference profile.
  You must score only against the provided profile and evidence. Do not reward content correctness,
  paper coverage, or general slide quality unless it directly affects stylistic alignment.

  Return valid JSON only.

template: |
  Evaluate the stylistic alignment of two generated slide plans against this fixed author preference profile.

  Author profile JSON:
  {{ author_profile_json | tojson }}

  Baseline plan summary:
  {{ baseline_plan_summary_json | tojson }}

  Personalized plan summary:
  {{ personalized_plan_summary_json | tojson }}

  Extracted asset availability summary:
  {{ extracted_asset_summary_json | tojson }}

  Scoring rubric:
  - Score each dimension from 0.0 to 1.0.
  - 1.0 means strong alignment with the profile.
  - 0.5 means partially aligned or inconclusive.
  - 0.0 means clearly misaligned.
  - Use only the profile and the plan summaries.
  - Prefer concrete evidence over generic comments.
  - If `numeric_preferences` is present in the profile, use it as the primary target for text density alignment.
  - Use coarse labels like `medium` and `high` as secondary guidance for non-numeric preferences.
  - If extracted asset availability indicates that formulas or tables were not actually extracted for a deck, do not penalize that deck for low formula/table usage on that basis.
  - Only penalize formula or table alignment when the corresponding extracted assets were available enough for the planner to plausibly use them.

  Required dimensions:
  - section_structure_alignment
  - bullet_density_alignment
  - text_density_alignment
  - figure_usage_alignment
  - table_usage_alignment
  - formula_usage_alignment
  - layout_bias_alignment
  - overall_style_alignment

  Output JSON schema:
  {
    "baseline": {
      "scores": {
        "section_structure_alignment": 0.0,
        "bullet_density_alignment": 0.0,
        "text_density_alignment": 0.0,
        "figure_usage_alignment": 0.0,
        "table_usage_alignment": 0.0,
        "formula_usage_alignment": 0.0,
        "layout_bias_alignment": 0.0,
        "overall_style_alignment": 0.0
      },
      "rationale": {
        "section_structure_alignment": "short evidence",
        "bullet_density_alignment": "short evidence",
        "text_density_alignment": "short evidence",
        "figure_usage_alignment": "short evidence",
        "table_usage_alignment": "short evidence",
        "formula_usage_alignment": "short evidence",
        "layout_bias_alignment": "short evidence",
        "overall_style_alignment": "short evidence"
      },
      "strengths": ["short point", "short point"],
      "mismatches": ["short point", "short point"]
    },
    "personalized": {
      "scores": {
        "section_structure_alignment": 0.0,
        "bullet_density_alignment": 0.0,
        "text_density_alignment": 0.0,
        "figure_usage_alignment": 0.0,
        "table_usage_alignment": 0.0,
        "formula_usage_alignment": 0.0,
        "layout_bias_alignment": 0.0,
        "overall_style_alignment": 0.0
      },
      "rationale": {
        "section_structure_alignment": "short evidence",
        "bullet_density_alignment": "short evidence",
        "text_density_alignment": "short evidence",
        "figure_usage_alignment": "short evidence",
        "table_usage_alignment": "short evidence",
        "formula_usage_alignment": "short evidence",
        "layout_bias_alignment": "short evidence",
        "overall_style_alignment": "short evidence"
      },
      "strengths": ["short point", "short point"],
      "mismatches": ["short point", "short point"]
    },
    "lift": {
      "section_structure_alignment": 0.0,
      "bullet_density_alignment": 0.0,
      "text_density_alignment": 0.0,
      "figure_usage_alignment": 0.0,
      "table_usage_alignment": 0.0,
      "formula_usage_alignment": 0.0,
      "layout_bias_alignment": 0.0,
      "overall_style_alignment": 0.0
    },
    "summary": {
      "winner": "baseline or personalized or tie",
      "headline": "one sentence",
      "confidence": "low or medium or high"
    }
  }
