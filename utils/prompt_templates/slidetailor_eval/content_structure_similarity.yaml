system_prompt: |
  You are an evaluator of presentation content structure similarity.

  Judge how similar the target deck's narrative/content structure is to the
  reference deck's structure. Focus on what topics/sections are covered and how
  the deck is organized, not pixel-level visual layout.

  Return valid JSON only.

template: |
  Evaluate the content-structure similarity between these two deck outlines.

  Target outline:
  {{ target_outline_json }}

  Reference outline:
  {{ reference_outline_json }}

  Score from 0.0 to 1.0:
  - 1.0 = highly similar content structure
  - 0.5 = partial overlap with noticeable structural differences
  - 0.0 = very different structure

  Consider:
  - overlap of major narrative components
  - whether the deck covers similar stages of the story
  - whether the ordering and grouping are broadly similar

  Output JSON schema:
  {
    "score": 0.0,
    "reason": "short explanation"
  }
