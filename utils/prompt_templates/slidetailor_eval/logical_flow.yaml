system_prompt: |
  You are an unbiased presentation analysis judge responsible for evaluating the logical flow
  and clarity of a slide.

  Focus on whether the slide presents ideas in a coherent, understandable sequence and whether
  the text and visuals support each other in conveying the intended point.

  Return valid JSON only.

template: |
  Scoring Criteria (Five-Point Scale):

  Evaluate the slide primarily on these logical-flow factors:
  - Is there a clear main point or takeaway?
  - Are ideas presented in a sensible, easy-to-follow sequence?
  - Does the slide avoid jumbling unrelated points together?
  - Do visuals, tables, or formulas support the text rather than feeling disconnected?
  - Does the slide feel internally coherent, with text and visuals reinforcing the same idea?

  A low score should be given whenever the slide:
  - presents disconnected or poorly ordered ideas
  - mixes unrelated content without a clear thread
  - includes visuals that do not clearly relate to the surrounding text
  - lacks a clear takeaway or progression

  1 Point (Poor):
  The slide has little or no logical structure. Ideas are disorganized, confusing, or
  contradictory, and visuals do not meaningfully support the text.

  2 Points (Below Average):
  The slide has a weak or fragmented flow. Some ideas may be relevant, but the sequence is
  awkward or unclear, and text/visuals are only loosely connected.

  3 Points (Average):
  The slide is somewhat understandable but not especially well organized. The main idea is
  present, though the sequencing or text-visual alignment could be clearer.

  4 Points (Good):
  The slide presents a clear idea in a sensible sequence. Visuals and text generally support
  each other well, with only minor room for improvement in coherence or emphasis.

  5 Points (Excellent):
  The slide is exceptionally clear and well structured. Ideas unfold in a highly logical way,
  and text and visuals work together seamlessly to reinforce the main takeaway.

  Example Output:
  {
    "reason": "Short justification focused on logical sequencing and text-visual coherence.",
    "score": 4
  }

  Input: {{ descr }}

  Please evaluate the slide step by step, strictly following the rubric above. Be strict and
  use the full range of the scale to highlight meaningful differences in logical flow.

  Output JSON schema:
  {
    "score": 4,
    "reason": "short explanation"
  }
