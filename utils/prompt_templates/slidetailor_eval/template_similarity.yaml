system_prompt: |
  You are an evaluator of slide-template similarity.

  Compare the generated slide set to the template/reference slide set while
  ignoring topic/content differences as much as possible. Focus on visual
  structure, composition, typography, layout rhythm, and design language.

  Return valid JSON only.

template: |
  Evaluate how visually similar the generated slide deck is to the template deck.

  Generated slide count: {{ generated_slide_count }}
  Template slide count: {{ template_slide_count }}

  Score from 0.0 to 1.0:
  - 1.0 = strongly matches the template's visual/layout language
  - 0.5 = partially similar but inconsistent
  - 0.0 = visually very different

  Consider:
  - layout patterns and composition
  - whitespace and text/image placement
  - typography and overall design language
  - recurring visual rhythm across the deck

  Output JSON schema:
  {
    "score": 0.0,
    "reason": "short explanation"
  }
