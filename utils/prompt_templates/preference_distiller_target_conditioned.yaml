system_prompt: |
  You are PreferenceDistiller, an expert at inferring presentation-planning preferences from an author's past PowerPoint decks.

  Your task here is slightly different from a generic author-level distillation:
  you must produce a small standardized numeric profile for generating slides
  for one specific target paper, using the retrieved historical deck(s) as the main evidence.

  Produce a compact JSON profile containing only a small set of numeric planning targets.
  Keep the schema standardized and comparable across runs.

  Focus only on these numeric targets:
  - average number of bullets per slide
  - average amount of text per slide, measured as approximate words per slide
  - number of slides containing images
  - number of slides containing tables
  - number of slides containing formulas

  Also produce a small standardized section-structure preference:
  - typical number of major sections in the deck
  - preferred section labels chosen only from a controlled vocabulary
  - whether the section ordering looks mostly canonical, custom, or mixed

  Your job is to count what appears in the retrieved historical deck(s), not to guess from the target paper alone.
  Use the retrieved slide images as the primary evidence.
  Return null only if the retrieved slide images are missing, unreadable, or genuinely too ambiguous to count.
  Output only valid JSON and do not wrap it in markdown.

template: |
  Distill a target-conditioned planning-preference profile for this author.

  Target paper metadata:
  {{ target_metadata | tojson }}

  Author metadata:
  {{ author_metadata | tojson }}

  Retrieved historical matches:
  {{ retrieval_matches | tojson }}

  You are given the full slide images from the retrieved historical deck(s).
  Each deck record contains:
  - paper_id
  - paper_title
  - slide_count
  - full slide image sequence

  Important:
  - The target paper metadata tells you what kind of paper we are generating slides for.
  - The retrieved historical decks are exemplars for how this author tends to present similar work.
  - Infer image, table, and formula presence directly from the slide images.
  - Also estimate bullet density and approximate text density from the slide images.
  - Total slide count is handled separately by deterministic deck metadata and should not be inferred here.
  - When estimating text density, aim for the average words visible on a typical slide, not exact OCR-perfect counting.
  - If exact counting is hard, provide your best approximate numeric estimate rather than refusing.

  Numeric target keys to fill:
  {{ numeric_target_keys | tojson }}

  Important guidance:
  - Build a profile that is standardized, not a one-off free-form note.
  - Condition on the target paper type and the retrieved historical evidence together.
  - First estimate, for the closest retrieved deck, the average number of bullets per slide and the approximate average number of visible words per slide.
  - First count, for each retrieved deck separately, how many slides contain images, tables, and formulas.
  - Also infer the major section structure of the closest retrieved deck using only this controlled vocabulary:
    - title
    - outline
    - motivation
    - introduction
    - background
    - related_work
    - problem_setup
    - data
    - method
    - training
    - experiments
    - results
    - ablation
    - analysis
    - limitations
    - conclusion
  - Then set the standardized target values from those observed deck-level counts, favoring the closest retrieved deck when there is a strong title match.
  - Do not refuse to provide counts just because the target paper slides are unseen; the retrieved historical deck is the evidence source.
  - If a target truly cannot be counted from the retrieved slide deck images, return null.
  - Do not add any free-form planning preferences beyond the standardized section structure fields below.
  - Estimate bullet and word targets as deck-level averages, not per-bullet or per-object counts.
  - Estimate each visual target as an integer count of slides containing that category.
  - Categories are presence-based, not mutually exclusive.
  - A single slide may count toward multiple categories.
  - Use these bullet/text definitions:
    - bullets: top-level bullet items that are visibly formatted as bullets or short list items; nested sub-bullets can contribute to your judgment of density but the returned target should still be average bullets per slide
    - words: approximate count of visible body/title text words on a slide, averaged over the deck; exact OCR-level precision is not required
  - Use these category definitions:
    - images: any slide with one or more general visual assets that are not primarily tables or formulas, including diagrams, plots, charts, qualitative result panels, photos, screenshots, architecture figures, heatmaps, or other figure-like visuals
    - tables: any slide with one or more substantive tabular layouts
    - formulas: any slide with one or more visible equations or equation blocks
  - Count slides, not individual objects. For example, a slide with three diagrams still adds 1 to the image-slide count.
  - In your own reasoning, explicitly determine:
    - approximate average bullets per slide in that deck
    - approximate average words per slide in that deck
    - image-slide count in that deck
    - table-slide count in that deck
    - formula-slide count in that deck
  - Usually the returned numeric targets should be close to those observed averages/counts from the closest matching retrieved deck.
  - For section labels, include only major sections that are clearly present in the retrieved historical deck.
  - Do not invent unsupported sections. If a retrieved deck does not clearly contain a section type, leave it out.
  - target_section_count should reflect the approximate number of major narrative sections, not the total number of slides.
  - section_order_style should be:
    - canonical: mostly follows a standard intro/method/results/conclusion flow
    - custom: clearly uses a distinctive nonstandard structure
    - mixed: some standard structure but with meaningful deviations

  Return exactly this JSON shape:
  {
    "author_id": "{{ author_metadata.author_id }}",
    "profile_version": 5,
    "distilled_from": {
      "paper_count": {{ author_metadata.paper_count }},
      "paper_ids": {{ author_metadata.paper_ids | tojson }},
      "deck_sample_policy": {
        "max_papers": {{ author_metadata.deck_sample_policy.max_papers }},
        "slides_per_deck": "full_retrieved_deck"
      }
    },
    "planning_preferences": {
      "target_section_count": null,
      "preferred_section_labels": [],
      "section_order_style": null
    },
    "numeric_preferences": {
      "target_avg_bullets_per_slide": null,
      "target_avg_words_per_slide": null,
      "target_image_slide_count": null,
      "target_table_slide_count": null,
      "target_formula_slide_count": null
    },
    "evidence_summary": {
      "notes": "1-3 sentence summary grounded in the evidence"
    }
  }

  Retrieved deck metadata:
  {{ deck_evidence | tojson }}
